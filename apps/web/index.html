<!doctype html>
<html lang="en" data-theme="dark" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#090a0c" />
    <meta name="description" content="zerofee: a zero-platform-fee Solana memecoin trading terminal. You keep your keys." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>zerofee</title>
  </head>
  <body>
    <!--
      Static boot skeleton (DESIGN.md 4.18): painted with the stylesheet alone, before any script runs, so the
      first paint is the terminal's frame and skeleton rows instead of a blank page. React replaces it on its
      first render. Classes only (the CSP forbids inline styles); the same bars as SkeletonCards.
    -->
    <div id="root"><div class="flex h-full min-h-0 flex-col bg-bg" aria-busy="true" aria-label="Loading">
      <div class="h-11 shrink-0 border-b border-hairline bg-surface-1"></div>

    </div></div>
