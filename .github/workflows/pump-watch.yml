name: pump-watch

# Daily check that the official venue interfaces still match what packages/core is built against
# (packages/core/scripts/check-pump-idl.ts):
#   - pump.fun / PumpSwap: IDLs (pinned in packages/core/idl/SOURCE.json) and SDKs;
#   - Raydium LaunchLab / CPMM: IDLs (pinned in packages/core/idl/RAYDIUM_SOURCE.json), the
#     raydium-cp-swap program and raydium-cpi LaunchLab crate sources the layouts also come from,
#     and @raydium-io/raydium-sdk-v2.
# SDK pins are packages/core's devDependencies (the golden-test oracles). Opens an issue on drift
# (pump.fun typically gives about a week of devnet notice).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if bun run packages/core/scripts/check-pump-idl.ts > report.md; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "interface changed" also matches issues opened under the earlier pump.fun-only title.
          open=$(gh issue list --state open --search "interface changed in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "pump.fun / Raydium interface changed ($(date -u +%F))" --body-file report.md
          else
            echo "An open drift issue already exists; not opening another."
          fi
